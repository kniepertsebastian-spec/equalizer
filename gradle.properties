org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ADR 0001/0002: KSP (needed for Hilt/Room) does not support AGP 9's built-in
# Kotlin yet. Opting out re-enables the traditional org.jetbrains.kotlin.android
# plugin, which KSP/kapt-based tooling is built for. Both flags are required:
# builtInKotlin alone still leaves AGP 9's new DSL active, which also rejects
# org.jetbrains.kotlin.android (confirmed by a real CI failure - see
# docs/adr/0002-hilt-ksp-setup.md). See docs/adr/0001-defer-ksp-based-tooling.md.
android.builtInKotlin=false
android.newDsl=false

# Roadmap M1: package name and working title, centralized in one place.
# Update both together; also update app_name in
# app/src/main/res/values*/strings.xml if the display name should change too.
hardbasseq.applicationId=com.hardbasseq.eq
hardbasseq.namespace=com.hardbasseq.eq

# Debug/local-build fallback only (app/build.gradle.kts reads it via
# providers.gradleProperty(...).getOrElse(1)) - a real signed release
# (.github/workflows/release.yml) always passes its own -Phardbasseq.versionCode
# computed from the CI run number, which overrides this. Bumped by hand per the
# team's own convention: +1 here for a large change; a small change instead
# bumps hardbasseq.versionName's own fallback (currently the "0.2.0-m1"
# default in app/build.gradle.kts, e.g. to "0.2.1-m1").
hardbasseq.versionCode=2
