org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ADR 0001: KSP (needed for Hilt/Room) does not support AGP 9's built-in
# Kotlin yet. Opting out re-enables the traditional org.jetbrains.kotlin.android
# plugin, which KSP/kapt-based tooling is built for. See docs/adr/0001-defer-ksp-based-tooling.md.
android.builtInKotlin=false

# Roadmap M1: package name and working title, centralized in one place.
# Update both together; also update app_name in
# app/src/main/res/values*/strings.xml if the display name should change too.
hardbasseq.applicationId=com.hardbasseq.eq
hardbasseq.namespace=com.hardbasseq.eq
