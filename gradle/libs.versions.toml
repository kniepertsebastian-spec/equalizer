[versions]
agp = "9.4.0"
# ADR 0001: pinned to the newest Kotlin version KSP currently targets
# (see KSP's own gradle.properties, kotlinBaseVersion=2.3.20), not the
# project-wide latest (2.4.20), because Hilt/Room need KSP.
kotlin = "2.3.20"
ksp = "2.3.12"
hilt = "2.59.2"
hiltNavigationCompose = "1.4.0"
composeBom = "2026.08.00"
coreKtx = "1.16.0"
lifecycle = "2.10.0"
activityCompose = "1.10.1"
navigationCompose = "2.9.7"
junit = "4.13.2"
robolectric = "4.16"
coroutinesTest = "1.11.0"
# detekt is deliberately NOT added yet: its stable release does not support
# Kotlin 2.3.20 (only the 2.0.0-alpha line does, see docs/adr/0003). ktlint
# needs no such matching since it parses sources with its own bundled Kotlin
# compiler, independent of the project's Kotlin Gradle plugin version.
ktlint = "14.2.0"
room = "2.8.5"
datastore = "1.1.3"
work = "2.10.0"
kotlinxSerialization = "1.7.3"
# Coil 3.4.0 is the newest release built for Kotlin 2.3 (3.5+ need the 2.4 stdlib, see ADR 0001
# for why Kotlin stays on 2.3.20); its OkHttp (4.12) is the one :player already uses.
coil = "3.4.0"
# QR code encoder for sharing presets (roadmap 06, P5-4). Pure Java, no Android/Play-services dependency.
zxing = "3.5.3"
# :player (roadmap 06, P6-2): the versions the module used to hard-code, unchanged - moved here
# so one file shows every dependency. Raising any of them is a separate, tested step.
media3 = "1.11.1"
okhttp = "4.12.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
webkit = "1.11.0"
coreKtxPlayer = "1.13.1"
coroutinesAndroid = "1.11.0"
orgJson = "20240303"
mockito = "5.11.0"
androidxTestExtJunit = "1.1.5"
espresso = "3.5.1"

[libraries]
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
car-app = { module = "androidx.car.app:app", version = "1.4.0" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }

core-ktx-player = { module = "androidx.core:core-ktx", version.ref = "coreKtxPlayer" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-rules = { module = "androidx.test:rules", version = "1.6.1" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
