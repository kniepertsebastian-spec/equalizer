name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint
            core/build/reports/ktlint
            desktop/build/reports/ktlint
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # :core and :desktop are plain Kotlin/JVM modules (Session 18's
      # Windows/Linux companion) and don't use the Android testDebugUnitTest
      # task above, so they need their own explicit test invocation.
      - name: Run core/desktop unit tests
        run: ./gradlew :core:test :desktop:test --stacktrace

      - name: Upload core/desktop test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-desktop-test-results
          path: |
            core/build/reports/tests/test
            desktop/build/reports/tests/test
          if-no-files-found: warn

      - name: Run Android Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Optional: pushes the debug APK to a shared Google Drive folder so it
      # can be installed on a phone without downloading it from GitHub. The
      # step always runs; scripts/upload_apk_to_drive.sh itself exits 0
      # immediately if GDRIVE_SA_KEY_JSON is empty (see docs/DRIVE_UPLOAD.md),
      # so CI stays green either way until that secret is configured.
      - name: Upload debug APK to Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: "1xtR1iAIItwWrOco71gJG46bzRMHFnuhh"
          DRIVE_FILE_NAME: "HardBassEQ-debug-latest.apk"
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n1)
          export APK_PATH
          export DRIVE_DESCRIPTION="Branch ${BUILD_REF_NAME} - Commit ${BUILD_SHA} - Run ${BUILD_RUN_ID} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./scripts/upload_apk_to_drive.sh

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
