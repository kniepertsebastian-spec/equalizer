name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      # ktlintCheck only prints "violations found, see report" to the
      # console, not the violations themselves - print the actual report
      # contents into the job log too so a failure is diagnosable without
      # downloading the ktlint-reports artifact.
      - name: Print ktlint violations
        if: failure()
        run: |
          find app/build/reports/ktlint core/build/reports/ktlint \
            -name '*.txt' -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint
            core/build/reports/ktlint
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Both flavors (AuraCurve roadmap 02, 1.3): "store" without and "full" with the online code.
      - name: Run unit tests
        run: ./gradlew testStoreDebugUnitTest testFullDebugUnitTest --stacktrace

      # The store APK must not contain the unofficial SoundCloud access, the Spotify/YouTube link
      # resolution or the self-update. The full APK is checked the other way round, so a renamed
      # class cannot make the store check pass by no longer matching anything.
      - name: Check that the store APK has no online-access code
        run: |
          python3 -I scripts/check_store_apk.py app/build/outputs/apk/store/debug/app-store-debug.apk
          python3 -I scripts/check_store_apk.py --expect-present app/build/outputs/apk/full/debug/app-full-debug.apk

      # :core is a plain Kotlin/JVM module and doesn't use the Android
      # testDebugUnitTest task above, so it needs its own test invocation.
      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test
          if-no-files-found: warn

      # Roadmap 06, P6-3: the instrumented tests need a device and are not run here, but they must
      # at least keep compiling. The release build (R8, P6-6) is built too, so a missing keep rule
      # that makes shrinking fail shows up before a release tag does.
      - name: Compile instrumented tests and build the release APK
        run: ./gradlew :app:compileStoreDebugAndroidTestKotlin :app:compileFullDebugAndroidTestKotlin :app:assembleRelease --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintStoreDebug lintFullDebug lintStoreRelease lintFullRelease --stacktrace

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      # Optional: pushes the debug APK to a shared Google Drive folder so it
      # can be installed on a phone without downloading it from GitHub. The
      # step always runs; scripts/upload_apk_to_drive.sh itself exits 0
      # immediately if GDRIVE_SA_KEY_JSON is empty (see docs/DRIVE_UPLOAD.md),
      # so CI stays green either way until that secret is configured.
      - name: Upload debug APK to Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: "1xtR1iAIItwWrOco71gJG46bzRMHFnuhh"
          DRIVE_FILE_NAME: "HardBassEQ-debug-latest.apk"
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          # The personal build with everything; the store build is in the app-debug-apk artifact.
          APK_PATH=$(find app/build/outputs/apk/full/debug -maxdepth 1 -name '*.apk' | head -n1)
          export APK_PATH
          export DRIVE_DESCRIPTION="Branch ${BUILD_REF_NAME} - Commit ${BUILD_SHA} - Run ${BUILD_RUN_ID} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./scripts/upload_apk_to_drive.sh

      # PlayerShellUiTest renders the player's screens on the JVM and writes one PNG each; kept
      # as an artifact for a look at the layout without a device.
      - name: Upload player screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-screenshots
          path: app/build/player-screenshots
          if-no-files-found: warn

      # EqualizerScreenUiTest (AuraCurve roadmap 04, part A): every tab, the signal chain sheet, a short
      # phone and landscape, rendered on the JVM.
      - name: Upload equalizer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equalizer-screenshots
          path: app/build/equalizer-screenshots
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests
          if-no-files-found: warn
